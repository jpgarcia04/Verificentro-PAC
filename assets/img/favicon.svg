<!--
  PAC — Favicon. La hoja del logo sobre placa gris carbón (--gris-900).
  La placa no es capricho: el verde del logo sobre blanco da 1.9:1 y a 16 px
  se pierde contra la pestaña. Sobre carbón da 8.3:1 y se ve.
  Aquí va la hoja con nervaduras porque los navegadores modernos que leen
  SVG lo pintan a tamaño completo en pestañas y marcadores.
-->
