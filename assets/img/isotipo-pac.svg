<!--
  PAC — Isotipo (la hoja). Reconstruido en vectores a partir del logo.
  Se usa en el favicon y en el lockup del header.
  Las nervaduras están simplificadas a propósito para que siga leyéndose a 20-30px.
  PENDIENTE: reemplazar por el vectorial oficial cuando el cliente lo mande.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img"
     aria-label="Hoja verde del logotipo de PAC">

  <path d="M104 16C66 14 30 34 20 66c-8 26 6 40 28 38 34-4 60-44 56-88Z"
        fill="#97C45E"/>

  <g stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" fill="none">
    <!-- nervadura central -->
    <path d="M97 24 38 92"/>
    <!-- nervaduras hacia el borde exterior -->
    <path d="M85 38q10-1 16 4"/>
    <path d="M75 50q10-1 15 4"/>
    <path d="M64 62q10-1 15 4"/>
    <path d="M53 74q10-1 16 5"/>
    <!-- nervaduras hacia el borde interior -->
    <path d="M85 38q-5-9-6-15"/>
    <path d="M75 50q-6-9-7-15"/>
    <path d="M64 62q-5-9-6-15"/>
    <path d="M53 74q-5-9-6-14"/>
  </g>
</svg>
